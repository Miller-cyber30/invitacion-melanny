<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Melanny · Mis 11 años 🎀</title>
<meta name="description" content="Estás invitad@ a celebrar mis 11 años — Melanny">
<meta property="og:title" content="Melanny · Mis 11 años 🎀">
<meta property="og:description" content="Estás invitad@ a mi fiesta. ¡Ahí te espero!">
<meta property="og:image" content="assets/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#b85a76; --rose-d:#8f3f57; --gold:#c7a355; --gold-l:#e3cf9a;
  --blush:#fbeef1; --cream:#fff8f5; --ink:#6d4653; --line:#e8c9d3;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cormorant Garamond',serif;color:var(--ink);background:#eadfe0;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.story{max-width:460px;margin:0 auto;background:radial-gradient(120% 60% at 50% 0%,#fff8fa 0%,var(--cream) 40%,var(--blush) 100%);
  min-height:100vh;box-shadow:0 0 60px rgba(143,63,87,.25);position:relative;overflow:hidden}
.petalos{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.petalo{position:absolute;top:-30px;animation:caer linear forwards;opacity:.7}
@keyframes caer{to{transform:translateY(115vh) rotate(320deg)}}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px auto 2px;color:var(--gold)}
.orn i{height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i+i{transform:scaleX(-1)}
.bow{width:42px;height:28px}
.rev{opacity:0;transform:translateY(26px);transition:.9s cubic-bezier(.2,.7,.2,1)}
.rev.in{opacity:1;transform:none}
.hero{position:relative;height:92vh;min-height:560px;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;color:#fff;overflow:hidden}
.hero .bg{position:absolute;inset:0;background:center/cover no-repeat;transform:scale(1.06);animation:zoomin 12s ease-out forwards}
@keyframes zoomin{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(90,40,60,.28) 0%,rgba(90,40,60,0) 28%,rgba(80,30,50,.10) 55%,rgba(70,25,45,.72) 100%)}
.hero .top{position:absolute;top:26px;left:0;right:0;z-index:2;letter-spacing:5px;text-transform:uppercase;font-family:'Jost',sans-serif;font-size:.72rem;font-weight:300;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.hero .in{position:relative;z-index:2;padding:0 20px 40px}
.hero .mis{font-style:italic;font-size:1.35rem;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.hero .nom{font-family:'Pinyon Script',cursive;font-size:clamp(4.6rem,24vw,6.6rem);line-height:.82;margin:.1rem 0 .3rem;text-shadow:0 4px 22px rgba(0,0,0,.45)}
.hero .anos{font-family:'Jost',sans-serif;font-weight:300;letter-spacing:7px;text-transform:uppercase;font-size:.82rem;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.hero .scroll{position:absolute;bottom:12px;left:0;right:0;z-index:2;font-size:1.4rem;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(7px)}}
section{padding:52px 26px;text-align:center;position:relative}
.eyebrow{font-family:'Jost',sans-serif;font-weight:300;letter-spacing:4px;text-transform:uppercase;font-size:.7rem;color:var(--rose)}
.script{font-family:'Pinyon Script',cursive;color:var(--rose-d);font-size:clamp(2.6rem,10vw,3.4rem);line-height:1;margin:2px 0}
.body{font-size:1.28rem;max-width:360px;margin:12px auto 0;color:#7a5460}
.body em{color:var(--rose-d)}
.music{background:linear-gradient(180deg,#fff8f5,#fbeef1)}
.play{width:78px;height:78px;border-radius:50%;border:1.5px solid var(--gold);background:#fff;color:var(--rose);font-size:1.7rem;cursor:pointer;margin:16px auto 0;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(184,90,118,.22);transition:.3s}
.play:hover{transform:scale(1.06)}
.play.on{animation:spin 6s linear infinite;background:var(--rose);color:#fff;border-color:var(--rose)}
@keyframes spin{to{transform:rotate(360deg)}}
.play.on:hover{transform:none}
.music small{display:block;margin-top:12px;font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:#b98ea0}
.pl{margin-top:34px;padding-top:26px;border-top:1px solid var(--line)}
.pl-player{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.pl-player button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--rose);font-size:1rem;cursor:pointer;transition:.2s}
.pl-player #plPlay{width:60px;height:60px;font-size:1.3rem;border-color:var(--gold);color:#fff;background:var(--rose)}
.pl-player button:hover{transform:scale(1.08)}
.pl-now{margin-top:12px;font-style:italic;font-size:1.15rem;color:var(--rose-d);min-height:1.4em}
.pl-list{max-width:340px;margin:16px auto 0;text-align:left}
.pl-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;transition:.2s;font-size:1.15rem;color:#7a5460}
.pl-item:hover{background:#fff}
.pl-item.act{background:#fff;color:var(--rose-d);box-shadow:0 6px 16px rgba(184,90,118,.14)}
.pl-item .n{width:26px;height:26px;border-radius:50%;background:var(--blush);color:var(--rose);display:flex;align-items:center;justify-content:center;font-family:'Jost',sans-serif;font-size:.8rem;flex-shrink:0}
.pl-item.act .n{background:var(--rose);color:#fff}
.pl-empty{color:#b98ea0;font-style:italic;text-align:center;font-size:1.05rem}
.fecha{background:radial-gradient(100% 80% at 50% 0,#fff 0,#fbeef1 70%)}
.datebox{display:inline-flex;align-items:center;gap:18px;margin:14px 0 4px}
.datebox .dow,.datebox .my{font-family:'Jost',sans-serif;font-weight:300;letter-spacing:3px;text-transform:uppercase;font-size:.8rem;color:var(--rose)}
.datebox .num{font-family:'Cormorant Garamond',serif;font-size:3.6rem;font-weight:600;color:var(--rose-d);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:2px 12px;line-height:1.1}
.hora{font-style:italic;font-size:1.2rem;color:#7a5460}
.cd-label{margin-top:22px;font-family:'Jost',sans-serif;font-weight:300;letter-spacing:3px;text-transform:uppercase;font-size:.7rem;color:var(--rose)}
.cd{display:flex;justify-content:center;gap:10px;margin-top:12px}
.cd .c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;min-width:66px;box-shadow:0 8px 20px rgba(184,90,118,.12)}
.cd .c b{display:block;font-family:'Jost',sans-serif;font-weight:400;font-size:2rem;color:var(--rose-d);line-height:1}
.cd .c span{font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:#b98ea0;font-family:'Jost',sans-serif}
.ubica{background:linear-gradient(180deg,#fbeef1,#fff8f5)}
.dir{font-size:1.3rem;color:var(--rose-d);margin-top:8px}
.dir span{display:block;font-size:1.05rem;color:#7a5460;font-style:italic}
.btn{display:inline-block;margin-top:18px;font-family:'Jost',sans-serif;font-weight:400;letter-spacing:2px;text-transform:uppercase;font-size:.74rem;text-decoration:none;color:var(--rose-d);border:1.5px solid var(--gold);border-radius:40px;padding:13px 28px;background:#fff;cursor:pointer;transition:.3s}
.btn:hover{background:var(--rose);color:#fff;border-color:var(--rose)}
.conf{background:radial-gradient(100% 80% at 50% 100%,#fff 0,#fbeef1 70%)}
.btn.wa{background:var(--rose);color:#fff;border-color:var(--rose);font-size:.9rem;padding:16px 34px;margin-top:16px;box-shadow:0 12px 26px rgba(184,90,118,.3)}
.btn.wa:hover{background:var(--rose-d)}
.galeria{background:linear-gradient(180deg,#fff8f5,#fbeef1)}
.fotos{display:flex;flex-direction:column;gap:22px;margin-top:20px}
.foto{position:relative;background:#fff;padding:10px 10px 40px;box-shadow:0 14px 30px rgba(143,63,87,.16);border:1px solid #f0dfe4}
.foto:nth-child(odd){transform:rotate(-1.6deg)}
.foto:nth-child(even){transform:rotate(1.6deg)}
.foto figcaption{position:absolute;bottom:8px;left:0;right:0;font-family:'Pinyon Script',cursive;color:var(--rose-d);font-size:1.5rem}
.cierre{position:relative;height:88vh;min-height:520px;padding:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;overflow:hidden}
.cierre .bg{position:absolute;inset:0;background:center 20%/cover no-repeat}
.cierre::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(80,30,50,.45),rgba(80,30,50,.65))}
.cierre .in{position:relative;z-index:2;padding:20px}
.cierre .te{font-family:'Pinyon Script',cursive;font-size:clamp(3.4rem,16vw,5rem);line-height:.9;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.cierre .fn{font-family:'Jost',sans-serif;font-weight:300;letter-spacing:5px;text-transform:uppercase;font-size:.8rem;margin-top:14px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
footer{background:#8f3f57;color:#f6dee6;text-align:center;padding:22px;font-family:'Jost',sans-serif;font-weight:300;font-size:.72rem;letter-spacing:1px}
footer .k{font-size:1.4rem}
#intro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 20%,#fff5f8,#f4d9e2 60%,#e7bfcd);transition:opacity .9s,visibility .9s;padding:24px}
#intro.hide{opacity:0;visibility:hidden}
#intro .pre{font-family:'Jost',sans-serif;font-weight:300;letter-spacing:4px;text-transform:uppercase;font-size:.72rem;color:var(--rose)}
#intro .nm{font-family:'Pinyon Script',cursive;color:var(--rose-d);font-size:4.4rem;line-height:.8;margin:.1rem 0 .5rem}
.envelope{position:relative;width:280px;height:186px;margin:10px 0 6px;cursor:pointer}
.env-body{position:absolute;inset:0;background:linear-gradient(145deg,#fbe3ea,#f3c7d5);border-radius:10px;box-shadow:0 20px 40px rgba(143,63,87,.3)}
.env-bottom{position:absolute;bottom:0;left:0;right:0;height:110px;background:linear-gradient(180deg,#f7d5df,#efbccd);border-radius:0 0 10px 10px;clip-path:polygon(0 100%,50% 22%,100% 100%)}
.env-flap{position:absolute;top:0;left:0;width:0;height:0;border-left:140px solid transparent;border-right:140px solid transparent;border-top:112px solid #e9aec1;transform-origin:top;transition:transform .8s ease, z-index .8s;z-index:6;border-radius:8px 8px 0 0}
.envelope.open .env-flap{transform:rotateX(175deg);z-index:1}
.seal{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d78aa2,#a34e68);box-shadow:0 6px 14px rgba(143,63,87,.45);z-index:8;display:flex;align-items:center;justify-content:center;color:#fff8fb;font-family:'Pinyon Script',cursive;font-size:2rem;transition:.5s}
.envelope.open .seal{transform:translateX(-50%) scale(0);opacity:0}
.tap{margin-top:14px;font-family:'Jost',sans-serif;font-weight:400;letter-spacing:2px;text-transform:uppercase;font-size:.74rem;color:var(--rose-d);border:1.5px solid var(--gold);border-radius:40px;padding:12px 26px;background:#fff;cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
#music-fab{position:fixed;right:16px;bottom:16px;z-index:50;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--gold);background:#fff;color:var(--rose);font-size:1.3rem;cursor:pointer;box-shadow:0 8px 20px rgba(184,90,118,.3)}
#music-fab.on{animation:spin 6s linear infinite;background:var(--rose);color:#fff}
</style>
</head>
<body>
<div id="intro">
  <div class="pre">Estás invitad@ a mis</div>
  <div class="nm">Once años</div>
  <div class="envelope" id="env" onclick="abrir()">
    <div class="env-body"></div><div class="env-bottom"></div>
    <div class="seal">M</div><div class="env-flap"></div>
  </div>
  <button class="tap" onclick="abrir()">Abrir invitación 💌</button>
</div>
<div class="story" id="story">
  <div class="petalos" id="petalos"></div>
  <header class="hero">
    <div class="bg" id="heroBg"></div>
    <div class="top">· Mis 11 años ·</div>
    <div class="in">
      <div class="mis">Estás invitad@ a celebrar</div>
      <div class="nom" id="nomHero">Melanny</div>
      <div class="anos">Mis once años</div>
    </div>
    <div class="scroll">⌄</div>
  </header>
  <section class="music rev">
    <div class="orn"><i></i><svg class="bow" viewBox="0 0 60 40"><g fill="#c7a355"><path d="M30 20C16 6 6 10 8 20C6 30 16 34 30 20Z"/><path d="M30 20C44 6 54 10 52 20C54 30 44 34 30 20Z"/><circle cx="30" cy="20" r="5"/></g></svg><i></i></div>
    <div class="eyebrow">Con cariño</div>
    <div class="script">Reproduce mi canción</div>
    <button class="play" id="playMain" onclick="toggleMain()">▶</button>
    <small id="mainState">Toca para escuchar</small>
    <div class="pl">
      <div class="eyebrow">Y también…</div>
      <div class="script" style="font-size:clamp(2.2rem,8vw,2.8rem)">Las favoritas de Melanny</div>
      <div class="pl-player">
        <button onclick="prevTrack()" title="Anterior">⏮</button>
        <button id="plPlay" onclick="togglePlaylist()" title="Reproducir">▶</button>
        <button onclick="nextTrack()" title="Siguiente">⏭</button>
      </div>
      <div class="pl-now" id="plNow">—</div>
      <div class="pl-list" id="plList"><div class="pl-empty">Cargando canciones…</div></div>
    </div>
  </section>
  <section class="invita rev">
    <div class="orn"><i></i><span
