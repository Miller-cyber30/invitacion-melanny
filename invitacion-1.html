<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melanny cumple 11 🎀 | Invitación</title>
<meta name="description" content="¡Estás invitad@ al cumpleaños de Melanny!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
:root{ --rosa:#ff5d8f; --rosa-claro:#ffd1dc; --oro:#e7b84b; --texto:#7a4a5c; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;color:var(--texto);
  background:linear-gradient(160deg,#ffe6ee 0%,#ffd1e0 42%,#ffe9c9 100%);
  min-height:100vh;overflow-x:hidden;position:relative}
.rain{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}

/* Intro / puerta de entrada */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#ff9ec2,#ffcf99);text-align:center;transition:opacity .7s,visibility .7s;padding:20px}
#intro.hide{opacity:0;visibility:hidden}
#intro h2{font-family:'Pacifico';color:#fff;font-size:clamp(1.6rem,6vw,2.6rem);text-shadow:0 3px 0 #e46a95}
#intro p{color:#fff;margin:.4rem 0 1.4rem;font-weight:600}
.btn-abrir{background:#fff;color:var(--rosa);border:none;padding:15px 34px;border-radius:40px;font-weight:700;
  font-size:1.1rem;cursor:pointer;box-shadow:0 12px 26px rgba(0,0,0,.2);font-family:'Quicksand'}
.btn-abrir:hover{transform:scale(1.05)}
.kitty{width:140px;height:140px;animation:flota 3s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-12px)}}

/* Tarjeta */
.wrap{position:relative;z-index:2;display:flex;justify-content:center;padding:26px 14px 90px}
.invitacion{max-width:440px;width:100%;background:linear-gradient(180deg,#ffffff,#fff5f8);
  border-radius:34px;padding:30px 26px 34px;box-shadow:0 22px 54px rgba(255,93,143,.30);
  border:3px solid #ffe1ea;position:relative;overflow:hidden}
.invitacion::before{content:"";position:absolute;inset:8px;border:2px dashed #ffc2d6;border-radius:26px;pointer-events:none}
.tope{display:flex;justify-content:space-between;font-size:1.4rem}
.kitty-sm{width:120px;height:120px;display:block;margin:2px auto 6px;animation:flota 3.4s ease-in-out infinite}
.pre{text-align:center;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--rosa);font-size:.78rem}
.nombre{font-family:'Pacifico';text-align:center;font-size:clamp(2.4rem,11vw,3.4rem);color:var(--rosa);margin:.15rem 0;text-shadow:0 3px 0 #ffd1dc}
.edad{text-align:center;margin:.3rem 0 .1rem}
.edad .n{font-family:'Pacifico';font-size:4.6rem;color:var(--oro);line-height:.9;text-shadow:0 4px 0 #f6e0a6}
.edad .t{display:block;letter-spacing:6px;font-weight:700;color:var(--texto);text-transform:uppercase;font-size:.9rem}
.linea{height:2px;background:linear-gradient(90deg,transparent,#ffc2d6,transparent);margin:16px 0}
.frase{text-align:center;font-style:italic;color:#a86b7d;margin:6px 8px 14px}
.datos{display:grid;gap:12px;margin:6px 0 18px}
.dato{display:flex;gap:12px;align-items:center;background:#fff0f5;border-radius:16px;padding:12px 14px}
.dato .ic{font-size:1.5rem}
.dato b{display:block;color:var(--rosa);font-size:.72rem;text-transform:uppercase;letter-spacing:1px}
.dato span{font-weight:600}
.cd-titulo{text-align:center;font-weight:700;color:var(--rosa);margin:4px 0 8px;text-transform:uppercase;letter-spacing:2px;font-size:.78rem}
.rsvp{background:#fff0f5;border-radius:20px;padding:18px 16px;margin-top:14px}
.rsvp h3{text-align:center;color:var(--rosa);font-family:'Pacifico';font-weight:400;margin-bottom:10px;font-size:1.5rem}
.rsvp input,.rsvp textarea{width:100%;border:2px solid #ffd1dc;border-radius:12px;padding:11px 13px;margin-bottom:10px;font-family:'Quicksand';font-weight:600;color:var(--texto);background:#fff;resize:vertical}
.rsvp input:focus,.rsvp textarea:focus{outline:none;border-color:var(--rosa)}
.btn{width:100%;border:none;border-radius:40px;padding:14px;font-weight:700;font-size:1rem;cursor:pointer;font-family:'Quicksand';color:#fff;background:linear-gradient(90deg,#ff5d8f,#ff8fb3);box-shadow:0 8px 20px rgba(255,93,143,.4)}
.btn:hover{transform:translateY(-2px)}
.acciones{display:flex;gap:10px;margin-top:14px}
.acciones a,.acciones button{flex:1;text-decoration:none;text-align:center;border:2px solid var(--rosa);color:var(--rosa);background:#fff;border-radius:40px;padding:11px;font-weight:700;font-family:'Quicksand';cursor:pointer;font-size:.9rem}
.acciones a:hover,.acciones button:hover{background:var(--rosa);color:#fff}

#music{position:fixed;right:16px;bottom:16px;z-index:40;width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,#ff5d8f,#ff9ec2);color:#fff;font-size:1.5rem;cursor:pointer;box-shadow:0 8px 20px rgba(255,93,143,.5)}
#music.playing{animation:girar 4s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

.anim{opacity:0;transform:translateY(24px);transition:.6s}
body.go .anim{opacity:1;transform:none}
body.go .anim:nth-child(2){transition-delay:.08s}
body.go .anim:nth-child(3){transition-delay:.16s}
@media print{ #intro,#music,.rain,.acciones,.rsvp{display:none!important} body{background:#fff} }
</style>
</head>
<body>
<div class="rain" id="rain"></div>

<div id="intro">
  <svg class="kitty" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path d="M44 78 L58 30 L92 64 Z" fill="#fff" stroke="#f4bcd0" stroke-width="4"/>
    <path d="M156 78 L142 30 L108 64 Z" fill="#fff" stroke="#f4bcd0" stroke-width="4"/>
    <path d="M54 68 L61 42 L80 62 Z" fill="#ffd1dc"/><path d="M146 68 L139 42 L120 62 Z" fill="#ffd1dc"/>
    <ellipse cx="100" cy="112" rx="70" ry="60" fill="#fff" stroke="#f4bcd0" stroke-width="4"/>
    <g stroke="#f4bcd0" stroke-width="3" stroke-linecap="round"><path d="M30 108h30"/><path d="M28 122h30"/><path d="M170 108h-30"/><path d="M172 122h-30"/></g>
    <ellipse cx="76" cy="110" rx="8.5" ry="12" fill="#4a3540"/><ellipse cx="124" cy="110" rx="8.5" ry="12" fill="#4a3540"/>
    <circle cx="79" cy="105" r="3" fill="#fff"/><circle cx="127" cy="105" r="3" fill="#fff"/>
    <ellipse cx="60" cy="128" rx="11" ry="6.5" fill="#ffb0c8" opacity=".85"/><ellipse cx="140" cy="128" rx="11" ry="6.5" fill="#ffb0c8" opacity=".85"/>
    <path d="M100 120 c-4-6-15-4-15 3.5 c0 6.5 11 11.5 15 15 c4-3.5 15-8.5 15-15 c0-7.5-11-9.5-15-3.5 Z" fill="#ff5d8f"/>
    <path d="M86 138 q14 13 28 0" fill="none" stroke="#d98aa4" stroke-width="3.5" stroke-linecap="round"/>
    <g transform="translate(140,58)"><path d="M0 0 C-22-15 -22 15 0 0 Z" fill="#ff4d8d"/><path d="M0 0 C22-15 22 15 0 0 Z" fill="#ff4d8d"/><circle cx="0" cy="0" r="6.5" fill="#ff85b0"/></g>
  </svg>
  <h2>Melanny cumple 11 🎀</h2>
  <p>Tienes una invitación muy especial…</p>
  <button class="btn-abrir" onclick="abrir()">Abrir invitación 💌</button>
</div>

<div class="wrap">
  <div class="invitacion" id="tarjeta">
    <div class="tope"><span>🎀</span><span>🎀</span></div>
    <svg class="kitty-sm" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M44 78 L58 30 L92 64 Z" fill="#fff" stroke="#f4bcd0" stroke-width="4"/>
      <path d="M156 78 L142 30 L108 64 Z" fill="#fff" stroke="#f4bcd0" stroke-width="4"/>
      <path d="M54 68 L61 42 L80 62 Z" fill="#ffd1dc"/><path d="M146 68 L139 42 L120 62 Z" fill="#ffd1dc"/>
      <ellipse cx="100" cy="112" rx="70" ry="60" fill="#fff" stroke="#f4bcd0" stroke-width="4"/>
      <g stroke="#f4bcd0" stroke-width="3" stroke-linecap="round"><path d="M30 108h30"/><path d="M28 122h30"/><path d="M170 108h-30"/><path d="M172 122h-30"/></g>
      <ellipse cx="76" cy="110" rx="8.5" ry="12" fill="#4a3540"/><ellipse cx="124" cy="110" rx="8.5" ry="12" fill="#4a3540"/>
      <circle cx="79" cy="105" r="3" fill="#fff"/><circle cx="127" cy="105" r="3" fill="#fff"/>
      <ellipse cx="60" cy="128" rx="11" ry="6.5" fill="#ffb0c8" opacity=".85"/><ellipse cx="140" cy="128" rx="11" ry="6.5" fill="#ffb0c8" opacity=".85"/>
      <path d="M100 120 c-4-6-15-4-15 3.5 c0 6.5 11 11.5 15 15 c4-3.5 15-8.5 15-15 c0-7.5-11-9.5-15-3.5 Z" fill="#ff5d8f"/>
      <path d="M86 138 q14 13 28 0" fill="none" stroke="#d98aa4" stroke-width="3.5" stroke-linecap="round"/>
      <g transform="translate(140,58)"><path d="M0 0 C-22-15 -22 15 0 0 Z" fill="#ff4d8d"/><path d="M0 0 C22-15 22 15 0 0 Z" fill="#ff4d8d"/><circle cx="0" cy="0" r="6.5" fill="#ff85b0"/></g>
    </svg>
    <div class="pre anim">Estás invitad@ al cumple de</div>
    <h1 class="nombre anim" data-cfg="nombre">Melanny</h1>
    <div class="edad anim"><span class="n">11</span><span class="t">añitos</span></div>
    <div class="linea"></div>
    <p class="frase anim">✨ Ven a celebrar un día lleno de dulzura, moños y mucha diversión ✨</p>
    <div class="datos">
      <div class="dato anim"><span class="ic">📅</span><div><b>Fecha</b><span data-cfg="fechaTexto">—</span></div></div>
      <div class="dato anim"><span class="ic">🕒</span><div><b>Hora</b><span data-cfg="hora">—</span></div></div>
      <div class="dato anim"><span class="ic">📍</span><div><b>Lugar</b><span data-cfg="lugar">—</span><br><span data-cfg="direccion" style="font-weight:500;font-size:.85rem"></span></div></div>
    </div>
    <div class="cd-titulo anim">Faltan…</div>
    <div class="cd-wrap anim" id="cd"></div>
    <div class="rsvp anim">
      <h3>Confirma tu asistencia</h3>
      <form id="form">
        <input name="nombre" placeholder="Tu nombre y apellido" required>
        <input name="personas" type="number" min="1" value="1" placeholder="¿Cuántas personas?" required>
        <textarea name="mensaje" rows="2" placeholder="Mensaje para Melanny (opcional)"></textarea>
        <button class="btn" type="submit">Confirmar 🎉</button>
      </form>
    </div>
    <div class="acciones">
      <a data-cfg-href="mapsUrl" target="_blank" rel="noopener">📍 Cómo llegar</a>
      <button onclick="descargarPDF('#tarjeta','invitacion-melanny.pdf')">⬇️ PDF</button>
    </div>
  </div>
</div>

<button id="music" title="Música" onclick="toggleMusic()">🎵</button>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
  lluvia('#rain', ['🎀','💖','⭐','🌸','🐱']);
  countdown('cd');
  function abrir(){ document.getElementById('intro').classList.add('hide'); document.body.classList.add('go'); MusicBox.start(); setMusicBtn(); fiesta(); }
  function toggleMusic(){ MusicBox.toggle(); setMusicBtn(); }
  function setMusicBtn(){ const b=document.getElementById('music'); b.classList.toggle('playing',MusicBox.playing); b.textContent=MusicBox.playing?'🔊':'🎵'; }
  document.getElementById('form').addEventListener('submit', async e=>{
    e.preventDefault();
    const f=e.target, data={nombre:f.nombre.value.trim(),personas:+f.personas.value||1,mensaje:f.mensaje.value.trim()};
    const btn=f.querySelector('button'); btn.textContent='Enviando…'; btn.disabled=true;
    try{ const r=await enviarRSVP(data,'invitacion-1'); toast(r==='ok'?'¡Confirmado! Gracias 💖':'Te llevamos a WhatsApp 💬'); fiesta(); f.reset(); }
    catch(err){ toast('Ups, intenta de nuevo 🙏'); }
    btn.textContent='Confirmar 🎉'; btn.disabled=false;
  });
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3200); }
</script>
</body>
</html>
